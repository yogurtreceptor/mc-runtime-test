---
name: Lifecycle

"on":
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      dirs:
        description: Comma-delimited directories to build and run (i.e. api,1_20,1_21 )
        default: "all"
      test_mode:
        description: Platform checks to run
        type: choice
        default: all
        options: [all, rendered, headless, inmemory]
      headlessmc_repository:
        description: HeadlessMC repository for candidate testing
        default: "headlesshq/headlessmc"
      headlessmc_ref:
        description: HeadlessMC branch or commit to build (empty uses the release)
        default: ""
      ref:
        description: Git ref to checkout before build (i.e. my-feature-branch )
        default: "main"

concurrency: # FIXME: prevent release commit cancellation
  group: >
    ${{ github.workflow }}-
    ${{ github.event_name }}-
    ${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - if: github.event_name == 'push' # TODO: explicit on push to main
        id: release-please
        name: Run Release Please
        uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  matrices:
    if: github.event.action != 'closed'
    name: Construct matrices
    needs: release-please
    runs-on: ubuntu-latest
    outputs:
      build-matrix: ${{ steps.matrices.outputs.build-matrix }}
      run-matrix: ${{ steps.matrices.outputs.run-matrix }}
    steps:
      - name: Checkout 
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref || github.ref }}

      - if: github.event_name != 'workflow_dispatch'
        id: paths
        name: Get paths
        run: |
          { delimiter="$(openssl rand -hex 8)"
          echo "filter<<${delimiter}"
          for dir in $(find . -maxdepth 1 -type d -not -path "./.git*" -print | cut -d/ -f2-); do
            echo "'$dir' : ['$dir/**']"
          done; echo "${delimiter}"; } >> "${GITHUB_OUTPUT}"
          echo "${GITHUB_OUTPUT}"
          cat "${GITHUB_OUTPUT}" || true

      - if: github.event_name != 'workflow_dispatch'
        id: filter
        name: Filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            ${{ steps.paths.outputs.filter }}

      - id: matrices # TODO: build origin matrices dynamically, consider collapsing this into a .py
        name: Construct matrices
        run: |
          import os
          import json
          import copy

          build_matrix = {"include": []}
          run_matrix = {"version": []}

          with open('ci-data.json') as f:
              ci_data = json.load(f)
          
          build_data = ci_data['build_data']
          run_data = ci_data['run_data']

          dirs_to_filter = []
          mc_versions = []

          match os.getenv('GITHUB_EVENT_NAME'):
            case 'pull_request':
              if "${{ steps.filter.outcome }}" == "success":
                # Filter matrices based on the detected changes
                dirs_to_filter = json.loads('${{ steps.filter.outputs.changes }}')

            case 'workflow_dispatch':
              input_dirs = '${{ github.event.inputs.dirs }}'
              print(input_dirs)
              if input_dirs == 'all':
                # If "all" is specified in the input, run all possible builds and runs
                build_matrix['include'], run_matrix['version'] = build_data, run_data
                print(build_matrix)
                print(run_matrix)
              else:
                # Otherwise, filter based on the directories listed in the input
                dirs_to_filter = [item.strip() for item in input_dirs.split(',')]

            case 'push':
              if '${{ needs.release-please.outputs.release_created }}' == 'true':
                # If a release is created, use the full matrices
                build_matrix['include'], run_matrix['version'] = build_data, run_data

          if dirs_to_filter:
            build_matrix['include'].extend([item for item in build_data if item["dir"] in dirs_to_filter and ("mc" not in item or (item["mc"] in mc_versions or not mc_versions))])
            mc_versions = mc_versions if mc_versions else [item.get("mc") for item in build_matrix["include"] if "mc" in item]
            run_matrix['version'].extend([item for item in run_data if item["mc"] in mc_versions])

          for entry in run_matrix['version']:
            entry['runner'] = 'ubuntu-latest' #'blacksmith-2vcpu-ubuntu-2204'
            entry['cache'] = 'github' #'blacksmith'
            entry['xvfb'] = True
          
          additional_runs = []
          for item in run_matrix['version']:
            #runners = [ ('blacksmith-2vcpu-ubuntu-2204', 'blacksmith') ] # also add non-xvfb runs for ubuntu
            runners = [ ('ubuntu-latest', 'github') ] # also add non-xvfb runs for ubuntu
            if len(additional_runs) < 9: # add other runners only for the latest version * 3 modloaders * 3 runners
              runners += [ ('windows-latest', 'github'), ('macos-latest', 'github') ]
            for runner, cache in runners:
              entry = copy.deepcopy(item)
              entry['runner'] = runner
              entry['cache'] = cache
              entry['xvfb'] = False
              additional_runs.append(entry)
          
          run_matrix['version'] += additional_runs

          if '${{ inputs.test_mode }}' == 'inmemory':
            # One same-process check per version/loader, using the native entries.
            run_matrix['version'] = [dict(v, runner='macos-latest', xvfb=False, inmemory=True)
                                     for v in run_matrix['version'] if v['xvfb']]

          if '${{ inputs.test_mode }}' == 'rendered':
            run_matrix['version'] = [v for v in run_matrix['version'] if v['xvfb']]
          elif '${{ inputs.test_mode }}' == 'headless':
            run_matrix['version'] = [v for v in run_matrix['version'] if not v['xvfb']]
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
            print(json.dumps(build_matrix, indent=2))
            fh.write(f'build-matrix={json.dumps(build_matrix)}\n')
            print(json.dumps(run_matrix, indent=2))
            fh.write(f'run-matrix={json.dumps(run_matrix)}\n')
        shell: python {0}

  build:
    if: fromJSON(needs.matrices.outputs.build-matrix).include[0] != null
    name: Build
    needs: matrices
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrices.outputs.build-matrix) }}
    uses: ./.github/workflows/flex-build.yml
    with:
      dir: ${{ matrix.dir }}
      mc: ${{ matrix.mc }}
      lex: ${{ matrix.lex }}
      neo: ${{ matrix.neo }}
      java: ${{ matrix.java }}

  candidate-launcher:
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' && inputs.headlessmc_ref != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout candidate HeadlessMC
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: ${{ inputs.headlessmc_repository }}
          ref: ${{ inputs.headlessmc_ref }}
          path: candidate-launcher
      - name: Install Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 8
      - name: Build candidate launcher
        working-directory: candidate-launcher
        run: ./gradlew :headlessmc-launcher-wrapper:shadowJar --no-daemon
      - name: Prepare candidate artifact
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import shutil
          jars = [p for p in Path('candidate-launcher/headlessmc-launcher-wrapper/build/libs').glob('*.jar')
                  if not p.name.endswith(('-dev.jar', '-sources.jar', '-javadoc.jar'))]
          if len(jars) != 1:
              raise RuntimeError(f'Expected one launcher jar, found {jars}')
          shutil.copyfile(jars[0], 'headlessmc-launcher-0.0.0.jar')
          PYTHON
      - name: Upload candidate launcher
        uses: actions/upload-artifact@v4
        with:
          name: candidate-launcher
          path: headlessmc-launcher-0.0.0.jar

  run:
    if: >-
      !cancelled() && github.event_name != 'push' && needs.build.result == 'success'
      && (needs.candidate-launcher.result == 'success' || needs.candidate-launcher.result == 'skipped')
      && fromJSON(needs.matrices.outputs.run-matrix).version[0] != null
    name: Run tests
    needs:
      - matrices
      - build
      - candidate-launcher
    runs-on: ${{ matrix.version.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrices.outputs.run-matrix) }}
    steps:
      - name: Checkout # TODO: simplify away this step, currently needed for `uses: ./`
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 1

      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: jars-${{ matrix.version.mc }}

      - name: Bootstrap mods
        run: |
          mkdir -p run/mods
          cp mc-runtime-test-*-${{ matrix.version.type }}-release.jar run/mods

      - name: Setup Github Java temurin-${{ matrix.version.java }}
        if: matrix.version.cache == 'github'
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.version.java }}
          distribution: temurin

      - name: Setup Blacksmith Java temurin-${{ matrix.version.java }}
        if: matrix.version.cache == 'blacksmith'
        uses: useblacksmith/setup-java@4ef812391eff6e9737ba13bf0356d0f702877a64 # v5
        with:
          java-version: ${{ matrix.version.java }}
          distribution: temurin

      - name: Download candidate launcher
        if: inputs.headlessmc_ref != ''
        uses: actions/download-artifact@v4
        with:
          name: candidate-launcher

      - name: Install SDL OpenGL dependencies
        if: matrix.version.mc == '26.3' && matrix.version.xvfb
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libegl1 libegl-mesa0
          mkdir -p run/logs
          dpkg-query -W libegl1 libegl-mesa0 > run/logs/ci-graphics-packages.txt
        shell: bash

      - name: Run game with candidate launcher
        env:
          LIBGL_ALWAYS_SOFTWARE: ${{ matrix.version.mc == '26.3' && matrix.version.xvfb && '1' || '' }}
          SDL_VIDEO_FORCE_EGL: ${{ matrix.version.mc == '26.3' && matrix.version.xvfb && '1' || '' }}
        if: inputs.headlessmc_ref != ''
        timeout-minutes: 3
        uses: ./
        with:
          cache-mc: ${{ matrix.version.cache }}
          mc: ${{ matrix.version.mc }}
          mc-runtime-test: none
          modloader: ${{ matrix.version.modloader }}
          regex: ${{ matrix.version.regex }}
          java: ${{ matrix.version.java }}
          xvfb: ${{ matrix.version.xvfb }}
          download-hmc: false
          hmc-version: 0.0.0
          headlessmc-command: ${{ !matrix.version.xvfb && '-lwjgl' || '' }} ${{ matrix.version.inmemory && '-inmemory' || '' }} --retries 3 --jvm '"-Djava.awt.headless=true${{ matrix.version.mc == '26.3' && ' -DMcRuntimeGameTestInstance=minecraft:always_pass -DMcRuntimeGameTestMinExpectedGameTests=1' || '' }}"'

      - name: Run game
        if: inputs.headlessmc_ref == ''
        timeout-minutes: 3
        uses: ./
        with:
          cache-mc: ${{ matrix.version.cache }}
          mc: ${{ matrix.version.mc }}
          mc-runtime-test: none
          modloader: ${{ matrix.version.modloader }}
          regex: ${{ matrix.version.regex }}
          java: ${{ matrix.version.java }}
          xvfb: ${{ matrix.version.xvfb }}
          headlessmc-command: ${{ !matrix.version.xvfb && '-lwjgl' || '' }} ${{ matrix.version.inmemory && '-inmemory' || '' }} --retries 3 --jvm '"-Djava.awt.headless=true${{ matrix.version.mc == '26.3' && ' -DMcRuntimeGameTestInstance=minecraft:always_pass -DMcRuntimeGameTestMinExpectedGameTests=1' || '' }}"'

      - name: Retain candidate game logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-game-logs-${{ matrix.version.mc }}-${{ matrix.version.type }}-${{ matrix.version.runner }}-${{ matrix.version.xvfb }}
          path: |
            run/logs/**
            run/crash-reports/**
          if-no-files-found: ignore

  release:
    if: needs.release-please.outputs.release_created == 'true'
    needs:
      - release-please
      - build
    name: Release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4

      - name: Upload release artifacts
        uses: svenstaro/upload-release-action@04733e069f2d7f7f0b4aebc4fbdbce8613b03ccd # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: jars-*/*-release.jar
          tag: ${{ needs.release-please.outputs.tag_name }}
          overwrite: true
          file_glob: true

      - name: Upload api artifacts
        uses: svenstaro/upload-release-action@04733e069f2d7f7f0b4aebc4fbdbce8613b03ccd # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: jars-*/*-api-*.jar # TODO: make API jar names consistent with release jars, then simplify away this step
          tag: ${{ needs.release-please.outputs.tag_name }}
          overwrite: true
          file_glob: true

  clean: # TODO: run this conditionally per #22
    name: Clean up
    needs:
      - run
      - release
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts
        uses: geekyeggo/delete-artifact@f275313e70c08f6120db482d7a6b98377786765b # v5.1.0
        with:
          name: |
            jars-*
          failOnError: false
